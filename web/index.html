<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A quiet daily practice: guided sessions, the Bible, hymns, teaching videos and a private journal.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131211">
  <meta property="og:title" content="séance">
  <meta property="og:description" content="A quiet daily practice: guided sessions, the Bible, hymns, teaching videos and a private journal.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="séance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>séance</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while Flutter downloads; removed once the app draws its first frame. */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            background: #131211; color: #edeae3; transition: opacity .3s; }
    #boot .mark { font: italic 44px Georgia, "Playfair Display", serif; }
    #boot .bar { width: 120px; height: 2px; background: rgba(237,234,227,.15);
                 overflow: hidden; border-radius: 2px; }
    #boot .bar::after { content: ""; display: block; width: 40%; height: 100%;
                        background: rgba(237,234,227,.7);
                        animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
    noscript { color: #edeae3; font-family: sans-serif; }
    noscript a { color: #edeae3; }
  </style>
</head>
<body style="background:#131211; margin:0">
  <div id="boot" aria-label="Loading séance"><div class="mark">séance</div><div class="bar"></div></div>
  <noscript>
    <p style="padding:24px">séance needs JavaScript to run.
      <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide the loading screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
</body>
</html>
